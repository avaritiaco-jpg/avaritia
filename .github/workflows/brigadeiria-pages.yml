# Publica o site da Brigadeiria & Algo Mais no GitHub Pages:
# https://<usuário>.github.io/<repositório>/brigadeiria/
# Roda a cada mudança em brigadeiria/ no branch principal, ou à mão em Actions → "Publica a brigadeiria".
name: Publica a brigadeiria

on:
  push:
    branches: [claude/relaxed-cori-ve40ct]
    paths: ["brigadeiria/**", ".github/workflows/brigadeiria-pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: brigadeiria-pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: brigadeiria
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: brigadeiria/package-lock.json

      - run: npm ci

      - name: Gera o site estático
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}/brigadeiria
          NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/brigadeiria

      # Copia o site para a pasta brigadeiria/ do branch gh-pages, sem mexer no resto do branch
      - name: Publica no branch gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./brigadeiria/out
          destination_dir: brigadeiria
          keep_files: true
          commit_message: "Publica a brigadeiria"
